<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming // Auto-Sheets Sync</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --border-color: #1f293d;
            --accent-color: #00f0ff;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .title h1 {
            margin: 0;
            font-size: 22px;
            color: var(--accent-color);
            letter-spacing: 1px;
        }
        .title p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: var(--text-muted);
        }
        .btn {
            background: #1f293d;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:hover { background: #374151; }
        .btn-primary { background: #00f0ff; color: #000; border: none; }
        .btn-primary:hover { background: #00bfff; }
        
        .status-bar {
            background: #070a10;
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 13px;
            color: #00ff66;
            margin-bottom: 20px;
            font-family: monospace;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="text"] {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            width: 100%;
            padding: 6px;
            border-radius: 4px;
        }
        input[type="text"]:focus {
            background: #1a233a;
            border-color: var(--accent-color);
            outline: none;
        }
        input[type="checkbox"] {
            transform: scale(1.2);
            cursor: pointer;
            accent-color: var(--accent-color);
        }
        .text-center { text-align: center; }
        .delete-btn {
            color: #ef4444;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
        }
        .delete-btn:hover { color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">
            <h1>⚡ GAMING // AUTO-SHEETS SYNC</h1>
            <p>Đồng bộ 2 chiều thời gian thực & Tự động làm mới ngầm</p>
        </div>
        <div>
            <button class="btn" onclick="loadData()">🔄 Tải lại</button>
            <button class="btn btn-primary" onclick="addRow()">+ Thêm dòng</button>
        </div>
    </div>

    <div id="status" class="status-bar">STATUS: SẴN SÀNG</div>

    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th width="50">STT</th>
                    <th>TÀI KHOẢN (USERNAME)</th>
                    <th>MẬT KHẨU (PASSWORD)</th>
                    <th class="text-center">THỨ 2</th>
                    <th class="text-center">THỨ 3</th>
                    <th class="text-center">THỨ 4</th>
                    <th class="text-center">THỨ 5</th>
                    <th class="text-center">THỨ 6</th>
                    <th class="text-center">THỨ 7</th>
                    <th class="text-center">CHỦ NHẬT</th>
                    <th class="text-center">CẢ TUẦN</th>
                    <th>GHI CHÚ</th>
                    <th width="50" class="text-center">XÓA</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Dữ liệu được render bằng JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxhBr9rviSra4no0UH_0-51w95PuphEqSkIosIwcIlt1UFw9NlV-TNPmGceke3hlBu-/exec";
    let tableData = [];
    let saveTimeout = null;

    async function loadData() {
        setStatus("ĐANG TẢI DỮ LIỆU TỪ GOOGLE SHEETS...", "#00f0ff");
        try {
            let response = await fetch(SCRIPT_URL);
            tableData = await response.json();
            renderTable();
            setStatus("ĐÃ ĐỒNG BỘ THÀNH CÔNG", "#00ff66");
        } catch (error) {
            console.error(error);
            setStatus("LỖI KHI TẢI DỮ LIỆU!", "#ef4444");
        }
    }

    function renderTable() {
        const tbody = document.getElementById("table-body");
        tbody.innerHTML = "";
        
        tableData.forEach((row, index) => {
            let tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td><input type="text" value="${row["Tài khoản"] || ""}" oninput="updateData(${index}, 'Tài khoản', this.value)"></td>
                <td><input type="text" value="${row["Mật khẩu"] || ""}" oninput="updateData(${index}, 'Mật khẩu', this.value)"></td>
                <td class="text-center"><input type="checkbox" ${row["Thứ 2"] === true || row["Thứ 2"] === "TRUE" ? "checked" : ""} onchange="updateData(${index}, 'Thứ 2', this.checked)"></td>
                <td class="text-center"><input type="checkbox" ${row["Thứ 3"] === true || row["Thứ 3"] === "TRUE" ? "checked" : ""} onchange="updateData(${index}, 'Thứ 3', this.checked)"></td>
                <td class="text-center"><input type="checkbox" ${row["Thứ 4"] === true || row["Thứ 4"] === "TRUE" ? "checked" : ""} onchange="updateData(${index}, 'Thứ 4', this.checked)"></td>
                <td class="text-center"><input type="checkbox" ${row["Thứ 5"] === true || row["Thứ 5"] === "TRUE" ? "checked" : ""} onchange="updateData(${index}, 'Thứ 5', this.checked)"></td>
                <td class="text-center"><input type="checkbox" ${row["Thứ 6"] === true || row["Thứ 6"] === "TRUE" ? "checked" : ""} onchange="updateData(${index}, 'Thứ 6', this.checked)"></td>
                <td class="text-center"><input type="checkbox" ${row["Thứ 7"] === true || row["Thứ 7"] === "TRUE" ? "checked" : ""} onchange="updateData(${index}, 'Thứ 7', this.checked)"></td>
                <td class="text-center"><input type="checkbox" ${row["Chủ Nhật"] === true || row["Chủ Nhật"] === "TRUE" ? "checked" : ""} onchange="updateData(${index}, 'Chủ Nhật', this.checked)"></td>
                <td class="text-center"><input type="checkbox" ${row["Cả tuần"] === true || row["Cả tuần"] === "TRUE" ? "checked" : ""} onchange="updateData(${index}, 'Cả tuần', this.checked)"></td>
                <td><input type="text" value="${row["Ghi chú"] || ""}" oninput="updateData(${index}, 'Ghi chú', this.value)"></td>
                <td class="text-center"><button class="delete-btn" onclick="deleteRow(${index})">✕</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function updateData(index, field, value) {
        tableData[index][field] = value;
        
        setStatus("ĐANG THAY ĐỔI...", "#fbbf24");
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            syncToServer();
        }, 1000);
    }

    function addRow() {
        tableData.push({
            "Tài khoản": "", "Mật khẩu": "",
            "Thứ 2": false, "Thứ 3": false, "Thứ 4": false, "Thứ 5": false, "Thứ 6": false, "Thứ 7": false, "Chủ Nhật": false, "Cả tuần": false,
            "Ghi chú": ""
        });
        renderTable();
        syncToServer();
    }

    function deleteRow(index) {
        tableData.splice(index, 1);
        renderTable();
        syncToServer();
    }

    async function syncToServer() {
        setStatus("ĐANG LƯU LÊN GOOGLE SHEETS...", "#00f0ff");
        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(tableData)
            });
            setStatus("ĐÃ LƯU THÀNH CÔNG VÀO GOOGLE SHEETS!", "#00ff66");
        } catch (error) {
            console.error(error);
            setStatus("LỖI KHI LƯU DỮ LIỆU!", "#ef4444");
        }
    }

    function setStatus(text, color) {
        const statusEl = document.getElementById("status");
        statusEl.innerText = "STATUS: " + text;
        statusEl.style.color = color;
    }

    loadData();
    setInterval(loadData, 10000);
</script>

</body>
</html>
