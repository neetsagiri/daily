<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Account Manager - Pro Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.12) 0%, transparent 40%),
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
        }

        @keyframes rgbNeonCycle {
            0% { border-color: #ff2a6d; box-shadow: 0 0 30px rgba(255, 42, 109, 0.4); }
            33% { border-color: #05d9e8; box-shadow: 0 0 30px rgba(5, 217, 232, 0.4); }
            66% { border-color: #7928ca; box-shadow: 0 0 30px rgba(121, 40, 202, 0.4); }
            100% { border-color: #ff2a6d; box-shadow: 0 0 30px rgba(255, 42, 109, 0.4); }
        }

        .neon-box { 
            border: 2px solid; 
            animation: rgbNeonCycle 8s infinite linear; 
            background: rgba(13, 17, 23, 0.9); 
            backdrop-filter: blur(12px); 
        }
        
        .gaming-checkbox {
            appearance: none; -webkit-appearance: none; width: 1.4rem; height: 1.4rem;
            background-color: #0b0f19; border: 2px solid #374151; border-radius: 0.3rem;
            cursor: pointer; position: relative; transition: all 0.2s ease-in-out;
        }
        .gaming-checkbox:checked { background: linear-gradient(135deg, #06b6d4, #a855f7); border-color: #38bdf8; box-shadow: 0 0 10px rgba(6,182,212,0.8); }
        .gaming-checkbox:checked::after { content: '✓'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #030712; font-size: 0.85rem; font-weight: 900; }

        .sheets-cell {
            background: transparent; border: 1px solid transparent; color: #cbd5e1; padding: 6px 10px; border-radius: 4px; width: 100%; font-size: 13px;
        }
        .sheets-cell:focus { border-color: #06b6d4; background: rgba(15, 23, 42, 0.95); outline: none; }

        #toast-container {
            position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            background: rgba(15, 23, 42, 0.95); border-left: 4px solid #06b6d4; color: #f8fafc;
            padding: 12px 20px; border-radius: 6px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            font-size: 12px; font-family: monospace; backdrop-filter: blur(8px);
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.2s forwards;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(10px); } }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-4 md:p-8 font-mono">
    
    <div id="toast-container"></div>

    <div class="max-w-7xl mx-auto bg-slate-900/90 neon-box rounded-2xl p-6 shadow-2xl">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 pb-4 border-b border-slate-800 gap-4">
            <div>
                <h1 class="text-2xl font-black tracking-wider uppercase text-cyan-400 flex items-center gap-3">
                    ⚡ GAMING // INSTANT SYNC 
                    <span id="accountCount" class="text-xs bg-slate-800 text-cyan-300 px-3 py-1 rounded-full border border-cyan-500/30">0 tài khoản</span>
                </h1>
                <p class="text-xs text-slate-400 mt-1">Đồng bộ tức thì ngay khi nhập xong hoặc tích chọn</p>
            </div>
            <div>
                <button onclick="addNewRow()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2 rounded text-xs cursor-pointer shadow-lg shadow-cyan-500/20 transition-all">+ THÊM DÒNG</button>
            </div>
        </div>

        <div class="mb-6 bg-slate-950/70 p-4 rounded-xl border border-slate-800">
            <div class="flex justify-between items-center mb-2 text-xs">
                <span class="text-slate-400 font-bold uppercase tracking-wider">📊 Tiến độ hoàn thành tuần này</span>
                <span id="progressText" class="text-cyan-400 font-bold">0%</span>
            </div>
            <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
                <div id="progressBar" class="bg-gradient-to-r from-cyan-500 to-purple-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <div class="overflow-x-auto rounded-xl border border-slate-800">
            <table class="w-full border-collapse text-center text-sm">
                <thead>
                    <tr class="bg-slate-950 text-slate-300 text-xs border-b border-slate-800 uppercase">
                        <th class="p-3 w-12 text-slate-500">STT</th>
                        <th class="p-3 text-left">TÀI KHOẢN (USERNAME)</th>
                        <th class="p-3 text-left">MẬT KHẨU (PASSWORD)</th>
                        <th class="p-3">THỨ 2</th>
                        <th class="p-3">THỨ 3</th>
                        <th class="p-3">THỨ 4</th>
                        <th class="p-3">THỨ 5</th>
                        <th class="p-3">THỨ 6</th>
                        <th class="p-3">THỨ 7</th>
                        <th class="p-3">CHỦ NHẬT</th>
                        <th class="p-3">CỬA TUẦN</th>
                        <th class="p-3 text-left pl-4">GHI CHÚ</th>
                        <th class="p-3">XÓA</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-800/50">
                    <!-- Dữ liệu load động -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_Y_aylmeYgUD59Wj651vjLg7dEIjDaiZPFQzhdHmXXPPSO2AWNmeB5nM94B7DUVai/exec";

        let accounts = [];

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast`;
            if (type === 'success') toast.style.borderLeftColor = '#10b981';
            if (type === 'error') toast.style.borderLeftColor = '#ef4444';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function copyToClipboard(text, label) {
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                showToast(`📋 Đã sao chép ${label}: ${text}`, 'success');
            }).catch(err => {
                showToast(`❌ Không thể sao chép!`, 'error');
            });
        }

        function updateProgress() {
            let totalCheckboxes = accounts.length * 8;
            if (totalCheckboxes === 0) {
                document.getElementById('progressBar').style.width = '0%';
                document.getElementById('progressText').innerText = '0%';
                document.getElementById('accountCount').innerText = '0 tài khoản';
                return;
            }

            let checkedCount = 0;
            accounts.forEach(item => {
                const days = ['thu2', 'thu3', 'thu4', 'thu5', 'thu6', 'thu7', 'cn', 'cua'];
                days.forEach(day => {
                    if (item[day] === true || item[day] === "TRUE") checkedCount++;
                });
            });

            let percent = Math.round((checkedCount / totalCheckboxes) * 100);
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').innerText = percent + '% hoàn thành';
            document.getElementById('accountCount').innerText = `${accounts.length} tài khoản`;
        }

        // Tải dữ liệu lần đầu tiên khi mở trang
        async function fetchSheetData() {
            try {
                let res = await fetch(SCRIPT_URL);
                accounts = await res.json();
                renderTable();
            } catch (err) {
                console.error(err);
                showToast("❌ Lỗi kết nối đến Google Sheets!", "error");
            }
        }

        // Đồng bộ ngay lập tức lên Google Sheets khi vừa nhập xong (onblur) hoặc vừa tích chọn (onchange)
        async function saveToSheet() {
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(accounts)
                });
                showToast("💾 Đã đồng bộ lên Google Sheets!", "success");
            } catch (err) {
                console.error(err);
                showToast("❌ Đồng bộ thất bại!", "error");
            }
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            accounts.forEach((item, index) => {
                let rowHtml = `<tr class="hover:bg-slate-800/40 transition-colors">
                    <td class="p-3 text-xs text-slate-500">${index + 1}</td>
                    <td class="p-2 text-left">
                        <div class="flex items-center gap-1.5">
                            <input type="text" value="${item.username || ''}" 
                                oninput="accounts[${index}].username = this.value;"
                                onblur="saveToSheet()" 
                                class="sheets-cell text-cyan-300 font-bold" placeholder="Tài khoản...">
                            <button onclick="copyToClipboard('${item.username || ''}', 'Tài khoản')" title="Sao chép tài khoản" class="text-slate-500 hover:text-cyan-400 p-1 cursor-pointer text-xs">📋</button>
                        </div>
                    </td>
                    <td class="p-2 text-left">
                        <div class="flex items-center gap-1.5">
                            <input type="text" value="${item.password || ''}" 
                                oninput="accounts[${index}].password = this.value;"
                                onblur="saveToSheet()" 
                                class="sheets-cell text-amber-300" placeholder="Mật khẩu...">
                            <button onclick="copyToClipboard('${item.password || ''}', 'Mật khẩu')" title="Sao chép mật khẩu" class="text-slate-500 hover:text-amber-400 p-1 cursor-pointer text-xs">📋</button>
                        </div>
                    </td>`;

                const days = ['thu2', 'thu3', 'thu4', 'thu5', 'thu6', 'thu7', 'cn', 'cua'];
                days.forEach(day => {
                    let checked = (item[day] === true || item[day] === "TRUE") ? 'checked' : '';
                    rowHtml += `<td class="p-2 text-center">
                        <input type="checkbox" ${checked} 
                            onchange="accounts[${index}].${day} = this.checked; updateProgress(); saveToSheet();" 
                            class="gaming-checkbox">
                    </td>`;
                });

                rowHtml += `<td class="p-2 text-left pl-4">
                        <input type="text" value="${item.note || ''}" 
                            oninput="accounts[${index}].note = this.value;"
                            onblur="saveToSheet()" 
                            class="sheets-cell text-purple-300" placeholder="Ghi chú...">
                    </td>
                    <td class="p-2 text-center">
                        <button onclick="accounts.splice(${index}, 1); renderTable(); saveToSheet(); showToast('🗑️ Đã xóa dòng!', 'info');" class="text-slate-600 hover:text-red-400 font-bold p-1 cursor-pointer" title="Xóa dòng">✕</button>
                    </td>
                </tr>`;
                tbody.innerHTML += rowHtml;
            });

            updateProgress();
        }

        function addNewRow() {
            accounts.push({
                stt: accounts.length + 1,
                username: "",
                password: "",
                thu2: false, thu3: false, thu4: false, thu5: false, thu6: false, thu7: false, cn: false, cua: false,
                note: ""
            });
            renderTable();
            saveToSheet();
            showToast("✨ Đã thêm dòng mới!", "success");
        }

        // Chỉ tải dữ liệu một lần duy nhất khi mở trang web
        fetchSheetData();
    </script>
</body>
</html>
