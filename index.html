<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Account Manager - Live Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.12) 0%, transparent 40%),
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
        }

        input, code, .mono-text {
            font-family: 'JetBrains Mono', monospace;
        }

        @keyframes rgbNeonCycle {
            0% { border-color: #ff2a6d; box-shadow: 0 0 25px rgba(255, 42, 109, 0.3); }
            33% { border-color: #05d9e8; box-shadow: 0 0 25px rgba(5, 217, 232, 0.3); }
            66% { border-color: #7928ca; box-shadow: 0 0 25px rgba(121, 40, 202, 0.3); }
            100% { border-color: #ff2a6d; box-shadow: 0 0 25px rgba(255, 42, 109, 0.3); }
        }

        .neon-box { 
            border: 2px solid; 
            animation: rgbNeonCycle 8s infinite linear; 
            background: rgba(13, 17, 23, 0.95); 
            backdrop-filter: blur(12px); 
        }
        
        .gaming-checkbox {
            appearance: none; -webkit-appearance: none; width: 1.35rem; height: 1.35rem;
            background-color: #0b0f19; border: 2px solid #4b5563; border-radius: 0.35rem;
            cursor: pointer; position: relative; transition: all 0.2s ease-in-out;
        }
        .gaming-checkbox:checked { background: linear-gradient(135deg, #06b6d4, #a855f7); border-color: #38bdf8; box-shadow: 0 0 10px rgba(6,182,212,0.8); }
        .gaming-checkbox:checked::after { content: '✓'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #030712; font-size: 0.85rem; font-weight: 900; }

        .sheets-cell {
            background: rgba(15, 23, 42, 0.7); 
            border: 1px solid #334155; 
            color: #f1f5f9; 
            padding: 7px 10px; 
            border-radius: 6px; 
            width: 100%; 
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: all 0.2s;
        }
        .sheets-cell:focus { 
            border-color: #06b6d4; 
            background: rgba(15, 23, 42, 0.98); 
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.25);
            outline: none; 
        }

        .copy-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #475569;
            color: #cbd5e1;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        .copy-btn:hover {
            background: rgba(6, 182, 212, 0.25);
            border-color: #06b6d4;
            color: #38bdf8;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
        }
        .copy-btn.copied {
            background: rgba(16, 185, 129, 0.25);
            border-color: #10b981;
            color: #34d399;
        }

        /* Hiệu ứng nhấp nháy cho đèn trạng thái */
        @keyframes pulseGlow {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 8px currentColor; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .status-dot {
            animation: pulseGlow 1.5s infinite;
        }

        #toast-container {
            position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            background: rgba(15, 23, 42, 0.95); border-left: 4px solid #06b6d4; color: #f8fafc;
            padding: 12px 18px; border-radius: 6px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            font-size: 12px; font-family: 'JetBrains Mono', monospace; font-weight: 500; backdrop-filter: blur(8px);
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.2s forwards;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(10px); } }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-3 md:p-8">
    
    <div id="toast-container"></div>

    <!-- POPUP MODAL THÊM TÀI KHOẢN -->
    <div id="addModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 neon-box rounded-xl p-6 w-full max-w-md space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-wider">✨ Thêm tài khoản game mới</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white font-bold text-base cursor-pointer">✕</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-xs font-semibold text-slate-300 block mb-1">Tài khoản</label>
                    <input type="text" id="inputUser" class="sheets-cell text-cyan-300 font-bold" placeholder="Nhập tên tài khoản...">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-300 block mb-1">Mật khẩu</label>
                    <input type="text" id="inputPass" class="sheets-cell text-amber-300 font-bold" placeholder="Nhập mật khẩu...">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-300 block mb-1">Ghi chú</label>
                    <input type="text" id="inputNote" class="sheets-cell text-purple-300 font-medium" placeholder="Nhập ghi chú...">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
                <button onclick="closeModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-4 py-2 rounded text-xs cursor-pointer">Hủy</button>
                <button onclick="submitNewRow()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2 rounded text-xs cursor-pointer shadow-lg shadow-cyan-500/20">Lưu tài khoản</button>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto bg-slate-900/90 neon-box rounded-2xl p-4 md:p-6 shadow-2xl">
        <!-- Header & Thống kê tích hợp Đèn Trạng Thái -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-5 pb-4 border-b border-slate-800 gap-3">
            <div>
                <h1 class="text-xl md:text-2xl font-extrabold tracking-wider uppercase text-cyan-400 flex items-center gap-2 flex-wrap">
                    ⚡ GAMING 
                    <span id="accountCount" class="text-xs font-bold bg-slate-800 text-cyan-300 px-2.5 py-1 rounded-full border border-cyan-500/30">0 tài khoản</span>
                    
                    <!-- ĐÈN TRẠNG THÁI KẾT NỐI -->
                    <div id="syncStatusBadge" class="flex items-center gap-1.5 bg-slate-950/80 px-2.5 py-1 rounded-full border border-slate-800 text-[11px] font-medium ml-auto md:ml-2">
                        <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 status-dot"></span>
                        <span id="statusText" class="text-slate-300">Đã lưu xong</span>
                    </div>
                </h1>
                <p class="text-xs font-medium text-slate-400 mt-1">Quản lý tài khoản game đồng bộ Sheets</p>
            </div>
            <div>
                <button onclick="openModal()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2.5 rounded-lg text-xs cursor-pointer shadow-lg shadow-cyan-500/20 transition-all">+ THÊM DÒNG</button>
            </div>
        </div>

        <!-- Thanh tiến độ tuần -->
        <div class="mb-5 bg-slate-950/70 p-4 rounded-xl border border-slate-800">
            <div class="flex justify-between items-center mb-2 text-xs font-semibold">
                <span class="text-slate-300 uppercase tracking-wider">📊 Tiến độ tuần này</span>
                <span id="progressText" class="text-cyan-400 font-bold text-sm">0%</span>
            </div>
            <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
                <div id="progressBar" class="bg-gradient-to-r from-cyan-500 to-purple-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <!-- Danh sách tài khoản -->
        <div id="container-body" class="space-y-3 md:space-y-0">
            <!-- Load động qua JS -->
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_Y_aylmeYgUD59Wj651vjLg7dEIjDaiZPFQzhdHmXXPPSO2AWNmeB5nM94B7DUVai/exec";

        let accounts = [];
        let isMobileView = window.innerWidth < 768;
        let syncTimer = null;

        // Cập nhật giao diện Đèn trạng thái trực quan
        function setSyncStatus(status) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (status === 'syncing') {
                dot.className = "w-2.5 h-2.5 rounded-full bg-amber-400 status-dot";
                text.innerText = "Đang đồng bộ...";
                text.className = "text-amber-300";
            } else if (status === 'saved') {
                dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 status-dot";
                text.innerText = "Đã lưu xong";
                text.className = "text-slate-300";
            } else if (status === 'error') {
                dot.className = "w-2.5 h-2.5 rounded-full bg-red-500 status-dot";
                text.innerText = "Lỗi đồng bộ";
                text.className = "text-red-300";
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast`;
            if (type === 'success') toast.style.borderLeftColor = '#10b981';
            if (type === 'error') toast.style.borderLeftColor = '#ef4444';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function copyText(text, label, btnElement) {
            if (!text) {
                showToast(`⚠️ Không có ${label} để sao chép!`, 'error');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                showToast(`📋 Đã sao chép ${label}: ${text}`, 'success');
                if (btnElement) {
                    let originalHTML = btnElement.innerHTML;
                    btnElement.innerHTML = '✓ Đã chép';
                    btnElement.classList.add('copied');
                    setTimeout(() => {
                        btnElement.innerHTML = originalHTML;
                        btnElement.classList.remove('copied');
                    }, 1500);
                }
            }).catch(err => {
                showToast(`❌ Lỗi sao chép!`, 'error');
            });
        }

        function updateProgress() {
            let totalCheckboxes = accounts.length * 8;
            if (totalCheckboxes === 0) {
                document.getElementById('progressBar').style.width = '0%';
                document.getElementById('progressText').innerText = '0%';
                document.getElementById('accountCount').innerText = '0 tài khoản';
                return;
            }

            let checkedCount = 0;
            accounts.forEach(item => {
                const days = ['thu2', 'thu3', 'thu4', 'thu5', 'thu6', 'thu7', 'cn', 'cua'];
                days.forEach(day => {
                    if (item[day] === true || item[day] === "TRUE") checkedCount++;
                });
            });

            let percent = Math.round((checkedCount / totalCheckboxes) * 100);
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').innerText = percent + '%';
            document.getElementById('accountCount').innerText = `${accounts.length} tài khoản`;
        }

        async function fetchSheetData() {
            try {
                let res = await fetch(SCRIPT_URL);
                accounts = await res.json();
                renderUI();
            } catch (err) {
                console.error(err);
                showToast("❌ Lỗi kết nối Google Sheets!", "error");
            }
        }

        // Đồng bộ ngầm thông minh cho ô nhập chữ
        function triggerAutoSync() {
            setSyncStatus('syncing');
            clearTimeout(syncTimer);
            syncTimer = setTimeout(async () => {
                executeSync();
            }, 600);
        }

        // Đồng bộ lập tức không độ trễ
        async function executeSync() {
            setSyncStatus('syncing');
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(accounts)
                });
                setSyncStatus('saved');
            } catch (err) {
                console.error(err);
                setSyncStatus('error');
                showToast("❌ Đồng bộ thất bại!", "error");
            }
        }

        function openModal() {
            document.getElementById('inputUser').value = '';
            document.getElementById('inputPass').value = '';
            document.getElementById('inputNote').value = '';
            document.getElementById('addModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('addModal').classList.add('hidden');
        }

        function submitNewRow() {
            let u = document.getElementById('inputUser').value.trim();
            let p = document.getElementById('inputPass').value.trim();
            let n = document.getElementById('inputNote').value.trim();

            if (!u && !p) {
                showToast("⚠️ Vui lòng nhập tài khoản hoặc mật khẩu!", "error");
                return;
            }

            accounts.push({
                stt: accounts.length + 1,
                username: u,
                password: p,
                thu2: false, thu3: false, thu4: false, thu5: false, thu6: false, thu7: false, cn: false, cua: false,
                note: n
            });

            closeModal();
            renderUI();
            executeSync();
            showToast("✨ Đã thêm tài khoản mới!", "success");
        }

        function renderUI() {
            const container = document.getElementById('container-body');
            container.innerHTML = '';

            if (!isMobileView) {
                let tableHtml = `
                    <div class="overflow-x-auto rounded-xl border border-slate-800">
                        <table class="w-full border-collapse text-center text-sm">
                            <thead>
                                <tr class="bg-slate-950 text-slate-300 text-xs font-bold border-b border-slate-800 uppercase tracking-wider">
                                    <th class="p-3.5 w-12 text-slate-500">STT</th>
                                    <th class="p-3.5 text-left">TÀI KHOẢN</th>
                                    <th class="p-3.5 text-left">MẬT KHẨU</th>
                                    <th class="p-3.5">T2</th>
                                    <th class="p-3.5">T3</th>
                                    <th class="p-3.5">T4</th>
                                    <th class="p-3.5">T5</th>
                                    <th class="p-3.5">T6</th>
                                    <th class="p-3.5">T7</th>
                                    <th class="p-3.5">CN</th>
                                    <th class="p-3.5">CỬA</th>
                                    <th class="p-3.5 text-left pl-4">GHI CHÚ</th>
                                    <th class="p-3.5">XÓA</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/50 font-medium">`;

                accounts.forEach((item, index) => {
                    let safeUser = (item.username || '').replace(/'/g, "\\'");
                    let safePass = (item.password || '').replace(/'/g, "\\'");

                    tableHtml += `<tr class="hover:bg-slate-800/40 transition-colors">
                        <td class="p-3.5 text-xs font-bold text-slate-500">${index + 1}</td>
                        <td class="p-2.5 text-left">
                            <div class="flex items-center gap-2">
                                <input type="text" value="${item.username || ''}" oninput="accounts[${index}].username = this.value; triggerAutoSync();" class="sheets-cell text-cyan-300 font-bold" placeholder="Tài khoản...">
                                <button onclick="copyText('${safeUser}', 'Tài khoản', this)" class="copy-btn text-xs px-2.5 py-1.5" title="Sao chép">📋 Copy</button>
                            </div>
                        </td>
                        <td class="p-2.5 text-left">
                            <div class="flex items-center gap-2">
                                <input type="text" value="${item.password || ''}" oninput="accounts[${index}].password = this.value; triggerAutoSync();" class="sheets-cell text-amber-300 font-bold" placeholder="Mật khẩu...">
                                <button onclick="copyText('${safePass}', 'Mật khẩu', this)" class="copy-btn text-xs px-2.5 py-1.5" title="Sao chép">📋 Copy</button>
                            </div>
                        </td>`;

                    const days = ['thu2', 'thu3', 'thu4', 'thu5', 'thu6', 'thu7', 'cn', 'cua'];
                    days.forEach(day => {
                        let checked = (item[day] === true || item[day] === "TRUE") ? 'checked' : '';
                        tableHtml += `<td class="p-2.5 text-center"><input type="checkbox" ${checked} onchange="accounts[${index}].${day} = this.checked; updateProgress(); executeSync();" class="gaming-checkbox"></td>`;
                    });

                    tableHtml += `<td class="p-2.5 text-left pl-4">
                            <input type="text" value="${item.note || ''}" oninput="accounts[${index}].note = this.value; triggerAutoSync();" class="sheets-cell text-purple-300" placeholder="Ghi chú...">
                        </td>
                        <td class="p-2.5 text-center">
                            <button onclick="accounts.splice(${index}, 1); renderUI(); executeSync(); showToast('🗑️ Đã xóa!', 'info');" class="text-slate-500 hover:text-red-400 font-bold p-1 cursor-pointer text-sm">✕</button>
                        </td>
                    </tr>`;
                });
                tableHtml += `</tbody></table></div>`;
                container.innerHTML = tableHtml;
            } else {
                accounts.forEach((item, index) => {
                    let safeUser = (item.username || '').replace(/'/g, "\\'");
                    let safePass = (item.password || '').replace(/'/g, "\\'");

                    let card = document.createElement('div');
                    card.className = "bg-slate-950/90 border border-slate-800 rounded-xl p-3.5 space-y-3 relative shadow-md";
                    
                    let daysHtml = '';
                    const dayLabels = {thu2: 'T2', thu3: 'T3', thu4: 'T4', thu5: 'T5', thu6: 'T6', thu7: 'T7', cn: 'CN', cua: 'Cửa'};
                    const days = ['thu2', 'thu3', 'thu4', 'thu5', 'thu6', 'thu7', 'cn', 'cua'];
                    
                    days.forEach(day => {
                        let checked = (item[day] === true || item[day] === "TRUE") ? 'checked' : '';
                        daysHtml += `
                            <div class="flex flex-col items-center bg-slate-900 p-1.5 rounded-lg border border-slate-800">
                                <span class="text-[11px] text-slate-400 mb-1 font-bold">${dayLabels[day]}</span>
                                <input type="checkbox" ${checked} onchange="accounts[${index}].${day} = this.checked; updateProgress(); executeSync();" class="gaming-checkbox">
                            </div>`;
                    });

                    card.innerHTML = `
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                            <span class="text-xs font-extrabold text-cyan-400 uppercase">#${index + 1} Tài khoản</span>
                            <button onclick="accounts.splice(${index}, 1); renderUI(); executeSync(); showToast('🗑️ Đã xóa!', 'info');" class="text-slate-400 hover:text-red-400 text-xs font-bold px-2 py-0.5">Xóa dòng ✕</button>
                        </div>
                        <div class="grid grid-cols-1 gap-2.5">
                            <div>
                                <label class="text-[11px] font-semibold text-slate-300 block mb-1">Tài khoản</label>
                                <div class="flex items-center gap-2">
                                    <input type="text" value="${item.username || ''}" oninput="accounts[${index}].username = this.value; triggerAutoSync();" class="sheets-cell text-cyan-300 font-bold" placeholder="User...">
                                    <button onclick="copyText('${safeUser}', 'Tài khoản', this)" class="copy-btn text-xs px-3 py-2 font-bold">📋 Copy</button>
                                </div>
                            </div>
                            <div>
                                <label class="text-[11px] font-semibold text-slate-300 block mb-1">Mật khẩu</label>
                                <div class="flex items-center gap-2">
                                    <input type="text" value="${item.password || ''}" oninput="accounts[${index}].password = this.value; triggerAutoSync();" class="sheets-cell text-amber-300 font-bold" placeholder="Pass...">
                                    <button onclick="copyText('${safePass}', 'Mật khẩu', this)" class="copy-btn text-xs px-3 py-2 font-bold">📋 Copy</button>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label class="text-[11px] font-semibold text-slate-300 block mb-1.5">Tiến độ tuần</label>
                            <div class="grid grid-cols-8 gap-1.5 text-center">
                                ${daysHtml}
                            </div>
                        </div>
                        <div>
                            <label class="text-[11px] font-semibold text-slate-300 block mb-1">Ghi chú</label>
                            <input type="text" value="${item.note || ''}" oninput="accounts[${index}].note = this.value; triggerAutoSync();" class="sheets-cell text-purple-300 font-medium" placeholder="Ghi chú thêm...">
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            updateProgress();
        }

        fetchSheetData();
    </script>
</body>
</html>
