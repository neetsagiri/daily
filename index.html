<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Account Manager - Split Columns</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.12) 0%, transparent 40%),
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
        }

        @keyframes rgb7ColorsBox {
            0% { border-color: rgba(239, 68, 68, 0.7); box-shadow: 0 0 25px rgba(239, 68, 68, 0.3); }
            50% { border-color: rgba(6, 182, 212, 0.7); box-shadow: 0 0 25px rgba(6, 182, 212, 0.3); }
            100% { border-color: rgba(239, 68, 68, 0.7); box-shadow: 0 0 25px rgba(239, 68, 68, 0.3); }
        }

        .neon-box { border: 2px solid; animation: rgb7ColorsBox 10s infinite linear; background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(12px); }
        
        .gaming-checkbox {
            appearance: none; -webkit-appearance: none; width: 1.4rem; height: 1.4rem;
            background-color: #0b0f19; border: 2px solid #374151; border-radius: 0.3rem;
            cursor: pointer; position: relative; transition: all 0.2s ease-in-out;
        }
        .gaming-checkbox:checked { background: linear-gradient(135deg, #06b6d4, #a855f7); border-color: #38bdf8; box-shadow: 0 0 10px rgba(6,182,212,0.8); }
        .gaming-checkbox:checked::after { content: '✓'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #030712; font-size: 0.85rem; font-weight: 900; }

        .sheets-cell {
            background: transparent; border: 1px solid transparent; color: #cbd5e1; padding: 6px 10px; border-radius: 4px; width: 100%; font-size: 13px;
        }
        .sheets-cell:focus { border-color: #06b6d4; background: rgba(15, 23, 42, 0.95); outline: none; }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-4 md:p-8 font-mono">
    <div class="max-w-7xl mx-auto bg-slate-900/90 neon-box rounded-2xl p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
            <div>
                <h1 class="text-2xl font-black tracking-wider uppercase text-cyan-400">⚡ GAMING // SHEETS SYNC</h1>
                <p class="text-xs text-slate-400 mt-1">Quản lý Tài khoản & Mật khẩu riêng biệt - Đồng bộ thời gian thực</p>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="fetchSheetData()" class="bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-cyan-500/50 px-4 py-2 rounded text-xs font-bold cursor-pointer">📥 TẢI LẠI</button>
                <button onclick="addNewRow()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2 rounded text-xs cursor-pointer">+ THÊM DÒNG</button>
            </div>
        </div>

        <div class="flex justify-between items-center mb-4 bg-slate-950/70 p-3 rounded-lg border border-slate-800">
            <span id="syncStatus" class="text-xs text-emerald-400 font-bold">STATUS: ĐÃ KẾT NỐI GOOGLE SHEETS</span>
        </div>

        <div class="overflow-x-auto rounded-xl border border-slate-800">
            <table class="w-full border-collapse text-center text-sm">
                <thead>
                    <tr class="bg-slate-950 text-slate-300 text-xs border-b border-slate-800 uppercase">
                        <th class="p-3 w-12 text-slate-500">STT</th>
                        <th class="p-3 text-left">TÀI KHOẢN (USERNAME)</th>
                        <th class="p-3 text-left">MẬT KHẨU (PASSWORD)</th>
                        <th class="p-3">THỨ 2</th>
                        <th class="p-3">THỨ 3</th>
                        <th class="p-3">THỨ 4</th>
                        <th class="p-3">THỨ 5</th>
                        <th class="p-3">THỨ 6</th>
                        <th class="p-3">THỨ 7</th>
                        <th class="p-3">CHỦ NHẬT</th>
                        <th class="p-3">CỬA TUẦN</th>
                        <th class="p-3 text-left pl-4">GHI CHÚ</th>
                        <th class="p-3">XÓA</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-800/50">
                    <!-- Dữ liệu load từ Sheets -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxQ_wv_kwlTxqZC2AXvuC44hcWdcjVB_otmFFteyY6vA2ME-PDiEeYT_bXvwtZu94Gb/exec";

        let accounts = [];

        async function fetchSheetData() {
            document.getElementById('syncStatus').innerText = "STATUS: ĐANG TẢI DỮ LIỆU TỪ GOOGLE SHEETS...";
            try {
                let res = await fetch(SCRIPT_URL);
                accounts = await res.json();
                renderTable();
                document.getElementById('syncStatus').innerText = "STATUS: ĐÃ ĐỒNG BỘ XONG ✅";
            } catch (err) {
                console.error(err);
                document.getElementById('syncStatus').innerText = "STATUS: LỖI KẾT NỐI ❌";
            }
        }

        async function saveToSheet() {
            document.getElementById('syncStatus').innerText = "STATUS: ĐANG LƯU LÊN GOOGLE SHEETS...";
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(accounts)
                });
                document.getElementById('syncStatus').innerText = "STATUS: ĐÃ LƯU THÀNH CÔNG ✅";
            } catch (err) {
                console.error(err);
                document.getElementById('syncStatus').innerText = "STATUS: LƯU THẤT BẠI ❌";
            }
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            accounts.forEach((item, index) => {
                let rowHtml = `<tr class="hover:bg-slate-800/40">
                    <td class="p-3 text-xs text-slate-500">${index + 1}</td>
                    <td class="p-2 text-left">
                        <input type="text" value="${item.username || ''}" oninput="accounts[${index}].username = this.value; saveToSheet();" class="sheets-cell text-cyan-300 font-bold" placeholder="Tài khoản...">
                    </td>
                    <td class="p-2 text-left">
                        <input type="text" value="${item.password || ''}" oninput="accounts[${index}].password = this.value; saveToSheet();" class="sheets-cell text-amber-300" placeholder="Mật khẩu...">
                    </td>`;

                ['thu2', 'thu3', 'thu4', 'thu5', 'thu6', 'thu7', 'cn', 'cua'].forEach(day => {
                    let checked = item[day] ? 'checked' : '';
                    rowHtml += `<td class="p-2 text-center">
                        <input type="checkbox" ${checked} onchange="accounts[${index}].${day} = this.checked; saveToSheet();" class="gaming-checkbox">
                    </td>`;
                });

                rowHtml += `<td class="p-2 text-left pl-4">
                        <input type="text" value="${item.note || ''}" oninput="accounts[${index}].note = this.value; saveToSheet();" class="sheets-cell text-purple-300" placeholder="Ghi chú...">
                    </td>
                    <td class="p-2 text-center">
                        <button onclick="accounts.splice(${index}, 1); renderTable(); saveToSheet();" class="text-slate-600 hover:text-red-400 font-bold p-1">✕</button>
                    </td>
                </tr>`;
                tbody.innerHTML += rowHtml;
            });
        }

        function addNewRow() {
            accounts.push({
                stt: accounts.length + 1,
                username: "",
                password: "",
                thu2: false, thu3: false, thu4: false, thu5: false, thu6: false, thu7: false, cn: false, cua: false,
                note: ""
            });
            renderTable();
            saveToSheet();
        }

        fetchSheetData();
    </script>
</body>
</html>
