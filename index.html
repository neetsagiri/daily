<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Account Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes rgb7ColorsBox {
            0% {
                border-color: rgba(239, 68, 68, 0.8);
                box-shadow: 0 0 20px rgba(239, 68, 68, 0.4), inset 0 0 15px rgba(239, 68, 68, 0.2);
            }
            14% {
                border-color: rgba(249, 115, 22, 0.8);
                box-shadow: 0 0 20px rgba(249, 115, 22, 0.4), inset 0 0 15px rgba(249, 115, 22, 0.2);
            }
            28% {
                border-color: rgba(234, 179, 8, 0.8);
                box-shadow: 0 0 20px rgba(234, 179, 8, 0.4), inset 0 0 15px rgba(234, 179, 8, 0.2);
            }
            42% {
                border-color: rgba(34, 197, 94, 0.8);
                box-shadow: 0 0 20px rgba(34, 197, 94, 0.4), inset 0 0 15px rgba(34, 197, 94, 0.2);
            }
            57% {
                border-color: rgba(6, 182, 212, 0.8);
                box-shadow: 0 0 20px rgba(6, 182, 212, 0.4), inset 0 0 15px rgba(6, 182, 212, 0.2);
            }
            71% {
                border-color: rgba(59, 130, 246, 0.8);
                box-shadow: 0 0 20px rgba(59, 130, 246, 0.4), inset 0 0 15px rgba(59, 130, 246, 0.2);
            }
            85% {
                border-color: rgba(168, 85, 247, 0.8);
                box-shadow: 0 0 20px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(168, 85, 247, 0.2);
            }
            100% {
                border-color: rgba(239, 68, 68, 0.8);
                box-shadow: 0 0 20px rgba(239, 68, 68, 0.4), inset 0 0 15px rgba(239, 68, 68, 0.2);
            }
        }

        @keyframes rgb7ColorsText {
            0% { color: #ef4444; text-shadow: 0 0 10px rgba(239,68,68,0.7); }
            14% { color: #f97316; text-shadow: 0 0 10px rgba(249,115,22,0.7); }
            28% { color: #eab308; text-shadow: 0 0 10px rgba(234,179,8,0.7); }
            42% { color: #22c55e; text-shadow: 0 0 10px rgba(34,197,94,0.7); }
            57% { color: #06b6d4; text-shadow: 0 0 10px rgba(6,182,212,0.7); }
            71% { color: #3b82f6; text-shadow: 0 0 10px rgba(59,130,246,0.7); }
            85% { color: #a855f7; text-shadow: 0 0 10px rgba(168,85,247,0.7); }
            100% { color: #ef4444; text-shadow: 0 0 10px rgba(239,68,68,0.7); }
        }

        @keyframes rgbBorderAnim {
            0% { border-color: #ef4444; box-shadow: 0 0 10px rgba(239,68,68,0.5); }
            14% { border-color: #f97316; box-shadow: 0 0 10px rgba(249,115,22,0.5); }
            28% { border-color: #eab308; box-shadow: 0 0 10px rgba(234,179,8,0.5); }
            42% { border-color: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,0.5); }
            57% { border-color: #06b6d4; box-shadow: 0 0 10px rgba(6,182,212,0.5); }
            71% { border-color: #3b82f6; box-shadow: 0 0 10px rgba(59,130,246,0.5); }
            85% { border-color: #a855f7; box-shadow: 0 0 10px rgba(168,85,247,0.5); }
            100% { border-color: #ef4444; box-shadow: 0 0 10px rgba(239,68,68,0.5); }
        }

        .neon-box {
            border: 2px solid;
            animation: rgb7ColorsBox 12s infinite linear;
        }

        .neon-title {
            animation: rgb7ColorsText 12s infinite linear;
        }

        .neon-rgb-btn {
            border: 2px solid;
            background-color: rgba(15, 23, 42, 0.9);
            animation: rgbBorderAnim 12s infinite linear;
            transition: all 0.3s ease;
        }
        .neon-rgb-btn:hover {
            filter: brightness(1.3);
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
        }

        /* Cải thiện trực quan ô tích (Checkbox Gaming) */
        .gaming-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 1.4rem;
            height: 1.4rem;
            background-color: #020617;
            border: 2px solid #334155;
            border-radius: 0.35rem;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease-in-out;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }

        .gaming-checkbox:hover {
            border-color: #06b6d4;
            box-shadow: 0 0 8px rgba(6,182,212,0.6), inset 0 0 5px rgba(0,0,0,0.8);
        }

        .gaming-checkbox:checked {
            background: linear-gradient(135deg, #06b6d4, #a855f7);
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(6,182,212,0.8), 0 0 20px rgba(168,85,247,0.5);
        }

        .gaming-checkbox:checked::after {
            content: '✔';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #020617;
            font-size: 0.85rem;
            font-weight: 900;
        }

        /* Checkbox Weekly riêng màu tím/hồng nổi bật */
        .gaming-checkbox.weekly-check:checked {
            background: linear-gradient(135deg, #ec4899, #a855f7);
            border-color: #f472b6;
            box-shadow: 0 0 12px rgba(236,72,153,0.8), 0 0 20px rgba(168,85,247,0.5);
        }

        .neon-input:focus {
            border-color: #06b6d4;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-mono">
    <div class="max-w-7xl mx-auto bg-slate-900 neon-box rounded-xl p-6 shadow-2xl">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
            <div>
                <h1 class="text-2xl font-black tracking-wider uppercase neon-title">
                    ⚡ SYSTEM // ACCOUNT_MANAGER
                </h1>
                <p class="text-xs text-slate-400 mt-1">Quản lý vòng lặp Daily & Weekly tự động hóa</p>
            </div>
            
            <div class="flex items-center space-x-3">
                <button onclick="openAddModal()" class="neon-rgb-btn font-bold px-4 py-2 rounded text-sm neon-title flex items-center space-x-1 cursor-pointer">
                    <span class="text-lg leading-none">+</span> <span>THÊM ACC</span>
                </button>
                <button onclick="resetData()" class="neon-rgb-btn font-bold px-4 py-2 rounded text-sm neon-title cursor-pointer">
                    LÀM MỚI
                </button>
            </div>
        </div>
        
        <!-- Thanh công cụ -->
        <div class="flex justify-between items-center mb-6 bg-slate-950/80 p-3 rounded-lg border border-slate-800 shadow-inner">
            <label class="flex items-center space-x-3 cursor-pointer select-none">
                <input type="checkbox" id="hideCompletedToggle" onchange="toggleHideCompleted()" class="gaming-checkbox">
                <span class="text-xs font-semibold text-slate-300 tracking-wide uppercase">Ẩn các ngày đã xong trong tuần</span>
            </label>
            <span class="text-xs neon-title font-bold">STATUS: RGB_7COLORS_ACTIVE</span>
        </div>

        <!-- Form thêm tài khoản -->
        <div id="addAccountModal" class="hidden mb-6 p-4 bg-slate-950 border border-purple-500/60 rounded-lg shadow-inner">
            <h3 class="font-bold text-purple-400 text-sm mb-3 tracking-wider uppercase">>> KẾT NỐI TÀI KHOẢN MỚI</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                <input type="text" id="newAccountUser" placeholder="Tài khoản (Username / Email)" class="bg-slate-900 border border-slate-800 text-slate-200 placeholder-slate-600 p-2 rounded text-sm neon-input outline-none">
                <input type="text" id="newAccountPass" placeholder="Mật khẩu" class="bg-slate-900 border border-slate-800 text-slate-200 placeholder-slate-600 p-2 rounded text-sm neon-input outline-none">
            </div>
            <div class="flex justify-end space-x-2">
                <button onclick="closeAddModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded text-xs cursor-pointer">HỦY</button>
                <button onclick="addNewAccount()" class="bg-purple-500 hover:bg-purple-400 text-slate-950 font-bold px-4 py-1.5 rounded text-xs neon-button cursor-pointer">XÁC NHẬN</button>
            </div>
        </div>

        <!-- Bảng quản lý -->
        <div class="overflow-x-auto">
            <table class="w-full border-collapse text-center text-sm">
                <thead>
                    <tr class="bg-slate-950 text-slate-300 text-xs border-b border-slate-800">
                        <th class="p-3 text-left">TÀI KHOẢN & MẬT KHẨU</th>
                        <th class="p-3 th-day" data-day="mon">THỨ 2</th>
                        <th class="p-3 th-day" data-day="tue">THỨ 3</th>
                        <th class="p-3 th-day" data-day="wed">THỨ 4</th>
                        <th class="p-3 th-day" data-day="thu">THỨ 5</th>
                        <th class="p-3 th-day" data-day="fri">THỨ 6</th>
                        <th class="p-3 th-day" data-day="sat">THỨ 7</th>
                        <th class="p-3 th-day" data-day="sun">CHỦ NHẬT</th>
                        <th class="p-3 text-left pl-6">WEEKLY (CHECK & NOTE)</th>
                    </tr>
                </thead>
                <tbody id="account-table-body" class="divide-y divide-slate-800/60">
                    <!-- Dữ liệu render bằng JS -->
                </tbody>
            </table>
        </div>

    </div>

    <script>
        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            var weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
            return d.getUTCFullYear() + '-W' + weekNo;
        }

        let currentWeek = getWeekNumber(new Date());
        let savedWeek = localStorage.getItem('gaming_current_week');

        let accountsData = JSON.parse(localStorage.getItem('gaming_accounts')) || [
            {
                id: 1,
                username: "user_01",
                password: "password_123",
                days: { mon: false, tue: false, wed: false, thu: false, fri: false, sat: false, sun: false },
                weekly: { checked: false, note: "Điểm danh tuần" }
            }
        ];

        if (savedWeek !== currentWeek) {
            accountsData.forEach(acc => {
                if (acc.days) {
                    Object.keys(acc.days).forEach(day => {
                        acc.days[day] = false;
                    });
                }
                if (acc.weekly) {
                    acc.weekly.checked = false;
                }
            });
            localStorage.setItem('gaming_current_week', currentWeek);
            localStorage.setItem('gaming_accounts', JSON.stringify(accountsData));
        }
        
        let hideCompleted = false;
        const daysList = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];

        function saveToStorage() {
            localStorage.setItem('gaming_accounts', JSON.stringify(accountsData));
        }

        function renderTable() {
            const tbody = document.getElementById('account-table-body');
            tbody.innerHTML = '';

            daysList.forEach(day => {
                const thElement = document.querySelector(`th.th-day[data-day="${day}"]`);
                if (thElement) {
                    if (hideCompleted && accountsData.length > 0) {
                        const allCompleted = accountsData.every(acc => acc.days && acc.days[day]);
                        thElement.style.display = allCompleted ? 'none' : '';
                    } else {
                        thElement.style.display = '';
                    }
                }
            });

            accountsData.forEach((acc, index) => {
                let rowHtml = `<tr class="hover:bg-slate-800/40 transition-all">
                    <td class="p-3 text-left font-medium text-slate-200">
                        <div class="text-xs"><span class="text-slate-500">ACC:</span> ${acc.username}</div>
                        <div class="text-xs"><span class="text-slate-500">PW:</span> <span class="tracking-widest">${acc.password}</span></div>
                    </td>`;

                daysList.forEach(day => {
                    const isChecked = acc.days[day] || false;
                    const isHidden = (hideCompleted && isChecked);
                    const displayStyle = isHidden ? 'style="display: none;"' : '';
                    
                    rowHtml += `
                        <td class="p-2 day-cell" data-day="${day}" ${displayStyle}>
                            <input type="checkbox" ${isChecked ? 'checked' : ''} 
                                onchange="updateStatus(${index}, '${day}', this.checked)"
                                class="gaming-checkbox">
                        </td>
                    `;
                });

                rowHtml += `
                    <td class="p-2 text-left pl-6">
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" ${acc.weekly.checked ? 'checked' : ''} 
                                onchange="updateWeeklyCheck(${index}, this.checked)"
                                class="gaming-checkbox weekly-check" title="Weekly Check">
                            <input type="text" value="${acc.weekly.note || ''}" 
                                onchange="updateWeeklyNote(${index}, this.value)"
                                placeholder="Ghi chú weekly..." 
                                class="bg-slate-950 border border-slate-800 text-slate-200 placeholder-slate-600 p-1.5 text-xs rounded w-full neon-input outline-none">
                        </div>
                    </td>
                `;

                rowHtml += `</tr>`;
                tbody.innerHTML += rowHtml;
            });
        }

        function updateStatus(accountIndex, day, status) {
            accountsData[accountIndex].days[day] = status;
            saveToStorage();
            renderTable();
        }

        function updateWeeklyCheck(accountIndex, status) {
            accountsData[accountIndex].weekly.checked = status;
            saveToStorage();
        }

        function updateWeeklyNote(accountIndex, noteText) {
            accountsData[accountIndex].weekly.note = noteText;
            saveToStorage();
        }

        function toggleHideCompleted() {
            hideCompleted = document.getElementById('hideCompletedToggle').checked;
            renderTable();
        }

        function openAddModal() {
            document.getElementById('addAccountModal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('addAccountModal').classList.add('hidden');
            document.getElementById('newAccountUser').value = '';
            document.getElementById('newAccountPass').value = '';
        }

        function addNewAccount() {
            const username = document.getElementById('newAccountUser').value.trim();
            const password = document.getElementById('newAccountPass').value.trim();

            if (!username) {
                alert('Vui lòng nhập tài khoản!');
                return;
            }

            const newAcc = {
                id: Date.now(),
                username: username,
                password: password || 'N/A',
                days: { mon: false, tue: false, wed: false, thu: false, fri: false, sat: false, sun: false },
                weekly: { checked: false, note: '' }
            };

            accountsData.push(newAcc);
            saveToStorage();
            closeAddModal();
            renderTable();
        }

        function resetData() {
            if (confirm('Bạn có muốn xóa sạch và tải lại dữ liệu mặc định không?')) {
                localStorage.removeItem('gaming_accounts');
                localStorage.removeItem('gaming_current_week');
                location.reload();
            }
        }

        renderTable();
    </script>
</body>
</html>
